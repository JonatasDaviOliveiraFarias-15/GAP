<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="img.png">
  <title>Caderno de Oração 🙏</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      width: 90%;
      max-width: 500px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      color: #2575fc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #2575fc;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1b5fd1;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    .pedido {
      background: #f3f6ff;
      border-left: 4px solid #2575fc;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
    }

    .nome {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .voltar {
      background: #999;
    }

    .checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  font-size: 15px;
  color: #333;
}

.checkbox input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
}

  </style>
</head>

<body>

<div class="container" id="home">
  <h1>🙏 Caderno de Oração</h1>
  <button onclick="mostrar('add')">Adicionar Pedido</button>
  <button onclick="mostrar('list')">Ver Pedidos</button>
</div>

<div class="container" id="add" style="display:none;">
    <h1>Novo Pedido</h1>
    <input id="nome" placeholder="Seu nome">
    <textarea id="pedido" placeholder="Digite seu pedido"></textarea>

    <div class="checkbox">
        <input type="checkbox" id="anonimo">
        <label for="anonimo">Enviar como anônimo</label>
    </div>


  <button onclick="salvarPedido()">Salvar</button>
  <button class="voltar" onclick="mostrar('home')">Voltar</button>
</div>

<div class="container" id="list" style="display:none;">
  <h1>Pedidos</h1>
  <div id="lista"></div>
  <button class="voltar" onclick="mostrar('home')">Voltar</button>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // 🔥 SUA CONFIG (essa que você já tem está OK)
  const firebaseConfig = {
    apiKey: "AIzaSyDeBdbSjyXszZZAJ4R3t0rcNVYS2nCJ4KE",
    authDomain: "caderno-de-oracao-55225.firebaseapp.com",
    projectId: "caderno-de-oracao-55225",
    storageBucket: "caderno-de-oracao-55225.firebasestorage.app",
    messagingSenderId: "309023293852",
    appId: "1:309023293852:web:abd61a4055966f0c8a0859"
  };

  // Inicializa Firebase e Firestore
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 🔹 TORNA AS FUNÇÕES GLOBAIS (para o onclick funcionar)
  window.mostrar = function (p) {
    ['home', 'add', 'list'].forEach(id => {
      document.getElementById(id).style.display = 'none';
    });
    document.getElementById(p).style.display = 'block';

    if (p === 'list') carregarPedidos();
  };

  window.salvarPedido = async function () {
    const nome = document.getElementById('nome').value;
    const pedido = document.getElementById('pedido').value;
    const anonimo = document.getElementById('anonimo').checked;

    if (!pedido) {
      alert('Escreva o pedido');
      return;
    }

    await addDoc(collection(db, "pedidos"), {
      nome: anonimo ? "Anônimo(a)" : (nome || "Sem nome"),
      pedido: pedido,
      data: new Date()
    });

    document.getElementById('nome').value = '';
    document.getElementById('pedido').value = '';
    document.getElementById('anonimo').checked = false;

    alert("Pedido enviado 🙏");
    mostrar('home');
  };

  async function carregarPedidos() {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';

    const q = query(collection(db, "pedidos"), orderBy("data", "desc"));
    const snapshot = await getDocs(q);

    snapshot.forEach(doc => {
      const p = doc.data();
      lista.innerHTML += `
        <div class="pedido">
          <div class="nome">${p.nome}</div>
          <div>${p.pedido}</div>
        </div>
      `;
    });
  }
</script>


</body>
</html>
